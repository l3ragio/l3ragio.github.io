# Zenodo concepts found under the author's name that are deliberately NOT
# given a scholarly page. Reason codes are reported by the sync script.
excluded:
  - concept: 20173417
    reason: "Access restricted, no public file. Metadata publication date 1979-03 and affiliation 'Institute for Advanced Study, Princeton' are not supported by any public evidence; flagged for the author."
  - concept: 20173419
    reason: "Access restricted, no public file. Second concept carrying the title of the Intersection Algebra paper (whose open concept is 20155195) plus a 2003-11 version titled 'Toward a Four-Family Classification...'; flagged as a duplicate identity."
  - concept: 23220351
    reason: "Software (reproducibility artifact, Apache-2.0), not a scholarly paper. The paper it supports is not on Zenodo."
