# Curated gate for the scholarly paper pages under /research/papers/.
#
# Each entry names ONE scholarly work by its Zenodo concept record id.
# `scripts/sync_zenodo_papers.py` reads this file, fetches the public
# Zenodo metadata, mirrors the preferred version's PDF into
# research/papers/<slug>/paper.pdf and (re)generates _papers/<slug>.md.
#
# A Zenodo record that the sync discovers but that is NOT listed here
# (under `papers` or `excluded`) is reported as NEW and is never
# published automatically. Add it here deliberately after checking that
# it belongs to the public scholarly collection.
#
# Fields (papers):
#   slug           kebab-case, stable; becomes the URL and must never change
#   concept        Zenodo concept record id (the work identity)
#   record         optional: pin the preferred version record id
#                  (default: latest open version carrying exactly one PDF)
#   bibtex_key     stable citation key (kept from the earlier site list)
#   research_line  optional label shown on the page
#   project        optional site path of the related research line page
#   iris           optional verified IRIS Sapienza handle URL(s)
#
# Only facts verified at the source go here. Bibliographic data (title,
# authors, dates, abstract, DOIs, licence) is NOT entered by hand: it is
# taken from Zenodo by the sync script.

papers:
  - slug: intersection-algebra-ltl
    concept: 20155195
    bibtex_key: bragetti2026intersectionalgebra
    research_line: Temporal Evaluation
    project: /research/ltl-evaluation/
    iris: [https://iris.uniroma1.it/handle/11573/1767773]

