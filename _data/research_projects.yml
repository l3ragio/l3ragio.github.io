- id: mck-properties
  url: "/research/mck-properties/"
  layer: "Property layer"
  status: "Preprint cluster"
  title: "MCK Properties"
  question: "What properties should an agent, artifact, or governance relationship make observable?"
  description: "MCK is an observer-relative vocabulary for meaning, residual opacity, function, and agent property attribution. It supports property candidates such as identity, integrity, and freedom only when the carrier, evidence, and observer assumptions are declared."
  methods: "Observer-relative classification; region transitions; two-layer agent state; self-attribution; finite checkers."
  current_state: "Public preprint cluster. No peer-review acceptance is claimed."
