- id: drama-to-empowerment
  status: "Active research"
  title: "Drama to Empowerment"
  question: "Can multi-agent role transitions be treated as measurable protocol dynamics rather than descriptive labels?"
  description: "The public evidence is a finite-trace LTL treatment of transactional games over projected role traces. The empowerment direction remains an active extension about moving away from reactive role lock-in while preserving relevant agent properties."
  methods: "Role traces; transactional games; antithesis windows; governance interventions; property preservation."
  current_state: "Active research framing. Not a proved theory or published result under this exact title."
