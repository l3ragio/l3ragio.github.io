- id: ltl-evaluation
  url: "/research/ltl-evaluation/"
  layer: "Evaluation layer"
  status: "Working paper + preprints"
  title: "LTL / Property-Class Evaluation"
  question: "What can finite observations justify about temporal claims over an infinite or continuing trace?"
  description: "This line supplies the temporal evaluation language: safety, cosafety, liveness, coliveness, verdict alphabets, observation classes, and refinement-confirmation conditions for monitor verdict traces."
