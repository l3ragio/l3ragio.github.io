- id: ltl-triangles
  status: "Active research / experimental design"
  title: "LTL Triangles / Post-Failure Governance"
  question: "Which governance protocols contain a bounded failure while preserving unaffected invariants and restoring useful operation?"
  description: "The testbed evaluates what a governance intervention repairs, preserves, and newly makes unsafe after one bounded safety failure. It separates coordination, execution, and audit/challenge positions under asymmetric information, authority, incentives, observation rights, and intervention rights."
  methods: "Three-position protocols; one-fault bound; clean, honest-error, and malicious regimes; replayable traces; temporal verdicts."
  current_state: "Experimental design. The benchmark has not yet been run."
