# Editorial list of publications shown on /research/ and on the project pages.
#
# `paper:` names a generated scholarly page in _papers/<slug>.md (see
# _data/paper_sources.yml and scripts/sync_zenodo_papers.py). When it is set,
# the title, authors, year, abstract, PDF, DOI and BibTeX are taken from that
# page, which is generated from the public Zenodo record, so they are not
# repeated here. This file keeps only the editorial fields: status label,
# research line, venue line and the one-paragraph description.
#
# An entry without `paper:` may still carry title / authors / year / abstract /
# pdf / doi / bibtex directly (the include falls back to them).

- id: self-attribution
  paper: agent-self-attribution
  featured: true
  research_line: "MCK Properties"
  status: "Preprint"
  venue: "Zenodo preprint, version 3"
  description: "Develops the MCK self-attribution layer with a two-layer state separating structural carriers from semantic content, then studies continuity, viability, and owned branching as property signatures."

- id: mck-transitions
  paper: mck-region-transitions
  featured: true
  research_line: "MCK Properties"
  status: "Preprint"
  venue: "Zenodo preprint"
  description: "Studies restricted mechanisms for moving artifacts across MCK regions, including assimilation, operator admission, denotation, and reconstruction certificates."

- id: mck-foundation
  paper: meaning-opacity-function
  featured: true
  research_line: "MCK Properties"
  status: "Preprint"
  venue: "Zenodo preprint"
  description: "Defines the observer-relative MCK region system over meaning, residual opacity, and functionality, fixing the vocabulary used by later MCK work."

- id: ltl-intersection
  paper: intersection-algebra-ltl
  featured: true
  research_line: "Temporal Evaluation"
  status: "Working paper"
  venue: "Zenodo working paper"
  description: "Classifies omega-regular properties through temporal evidence classes and connects the classification to verdict alphabets for runtime monitoring."

- id: touch-crossing
  paper: touch-and-crossing
  featured: true
  research_line: "Temporal Evaluation"
  status: "Preprint"
  venue: "Zenodo preprint"
  description: "Argues that the touch and crossing modalities of threshold monitors are dual primitives with incomparable minimal resource requirements, and orders the tuning powers that realise the verdict-alphabet rungs."

- id: observation-monitorability
  paper: observation-relative-monitorability
  featured: true
  research_line: "Temporal Evaluation"
  status: "Preprint"
  venue: "Zenodo preprint"
  description: "Shows that monitorability of bounded temporal implication is joint in the formula and observation model, not a property of the formula alone."

- id: observation-control
  paper: observation-class-control
  featured: true
  research_line: "Temporal Evaluation"
  status: "Preprint"
  venue: "Zenodo preprint"
  description: "Engineering companion showing how a runtime monitor's observation class can be selected and locally tuned under physical and causal-coherence constraints."

- id: refinement-liveness
  paper: refinement-confirmation-liveness
  featured: true
  research_line: "Temporal Evaluation"
  status: "Preprint"
  venue: "Zenodo preprint"
  description: "Studies what extra refinement structure can supply when a finite monitor prefix cannot by itself confirm a liveness property over a continuing execution."

- id: typed-agent-actions
  paper: typed-agent-action-framework
  featured: true
  research_line: "Agent / Triangle Dynamics"
  status: "Technical report"
  venue: "Zenodo technical report"
  description: "Defines typed footprint action classes for agent actions and maps them onto prefix-verdict semantics over temporal property classes."

- id: transactional-games
  paper: transactional-games-temporal-signatures
  featured: true
  research_line: "Agent / Triangle Dynamics"
  status: "Preprint"
  venue: "Zenodo preprint"
  description: "Formalises transactional games as finite-trace LTL properties over Karpman-projected role traces, using the antithesis window to distinguish reactive and pre-committed regimes."

- id: autoimmune-rationalization
  paper: autoimmune-rationalization
  featured: true
  status: "Preprint"
  venue: "Zenodo preprint"
  description: "Shows that \"I believe only what I can prove\", read as an acceptance policy over finite confirmation, can defeat the system it protects without a single false verdict, and characterises when such protection is self-defeating."

- id: intentional-semantic-geometry
  paper: intentional-semantic-geometry
  featured: true
  status: "Preprint"
  venue: "Zenodo preprint"
  description: "Proposes Intentional Semantic Geometry: statements as grammar-mediated pointers into semantic spectra, with a typed calculus for the gap a partition leaves and for its reintegration."

- id: one-number-per-cell
  paper: one-number-per-cell
  featured: true
  status: "Preprint"
  venue: "Zenodo preprint"
  description: "Encodes several superimposed discrete curves with a single static number per cell, read as a member of a separating family, and proves the local-indistinguishability boundary for state-blind tracers."
